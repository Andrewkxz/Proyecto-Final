<!DOCTYPE html>
<html class="light" lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>AURA | Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#28211a",
                        "on-primary": "#ffffff",
                        "outline": "#7e766e",
                        "outline-variant": "#cfc5bc",
                        "on-surface-variant": "#4d463f",
                        "surface": "#fcf9f8",
                    },
                    fontFamily: {
                        "body-md": ["Plus Jakarta Sans"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"]
                    }
                }
            }
        }
    </script>
    <style>
        .glass-effect {
            background: rgba(252, 249, 248, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
    </style>
</head>

<body class="bg-surface text-primary font-body-md min-h-screen flex flex-col selection:bg-outline-variant">

    <nav class="fixed top-0 w-full z-50 bg-surface/80 backdrop-blur-md">
        <div class="flex justify-between items-center px-10 py-6 max-w-7xl mx-auto">
            <div class="text-2xl font-bold tracking-widest text-primary">AURA</div>
        </div>
    </nav>

    <main class="relative flex-grow flex items-center justify-center pt-24 pb-12 overflow-hidden">
        <div class="absolute inset-0 z-0">
            <img alt="Luxury Interior" class="w-full h-full object-cover opacity-80"
                src="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80">
            <div class="absolute inset-0 bg-primary/20"></div>
        </div>

        <div class="relative z-10 w-full max-w-md px-6">
            <div class="glass-effect p-10 md:p-12 rounded-3xl shadow-2xl flex flex-col items-center text-center">
                <span class="material-symbols-outlined text-primary text-4xl mb-4">account_balance</span>
                <h1 class="text-3xl font-bold text-primary mb-2">Acceso Exclusivo</h1>
                <p class="text-sm text-on-surface-variant mb-8">Ingrese sus credenciales para continuar.</p>

                <div th:if="${error}"
                    class="w-full bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4 text-sm"
                    role="alert">
                    <span class="block sm:inline" th:text="${error}"></span>
                </div>

                <form th:action="@{/login}" method="post" class="w-full space-y-4">
                    <div class="text-left">
                        <label
                            class="font-label-md text-xs font-bold text-on-surface-variant uppercase tracking-widest">Usuario</label>
                        <input type="text" name="username"
                            class="w-full mt-1 p-3 rounded-lg border border-outline-variant bg-white/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                            required>
                    </div>
                    <div class="text-left mb-6">
                        <label
                            class="font-label-md text-xs font-bold text-on-surface-variant uppercase tracking-widest">Contraseña</label>
                        <input type="password" name="password"
                            class="w-full mt-1 p-3 rounded-lg border border-outline-variant bg-white/50 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all"
                            required>
                    </div>

                    <button type="submit"
                        class="w-full py-4 bg-primary text-on-primary rounded-full font-bold uppercase tracking-widest text-xs hover:scale-[1.02] active:scale-95 transition-all duration-300 shadow-lg">
                        Iniciar Sesión
                    </button>

                    <div class="mt-6 text-center">
                        <p class="text-sm text-on-surface-variant">
                            ¿No tienes cuenta?
                        </p>

                        <a th:href="@{/registro}"
                            class="inline-block mt-3 px-6 py-3 border border-primary rounded-full font-bold text-xs uppercase tracking-widest hover:bg-primary hover:text-white transition-all duration-300">
                            Registrarse
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>

</html>
