<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PropTech | Dynamic Intelligence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/gojs@2.3.11/release/go.js"></script>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            --glass: rgba(255, 255, 255, 0.7);
            --glass-dark: rgba(30, 30, 30, 0.8);
        }

        body {
            background: #f3f4f6;
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0, transparent 50%), 
                              radial-gradient(at 50% 0%, rgba(168, 85, 247, 0.15) 0, transparent 50%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            transition: all 0.5s ease;
        }

        /* Efecto Dinámico de Tarjetas */
        .card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        /* Botones Animados */
        .btn-dynamic {
            border-radius: 16px;
            padding: 12px 20px;
            font-weight: 600;
            transition: all 0.3s;
            border: none;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .btn-dynamic:hover {
            background: var(--primary-gradient);
            color: white;
            transform: scale(1.02);
        }

        /* Contenedor del Árbol */
        #myDiagramDiv {
            width: 100%;
            height: 550px;
            border-radius: 24px;
        }

        /* Dark Mode */
        .dark-mode { background: #0b0f19; color: white; }
        .dark-mode .card { background: var(--glass-dark); border-color: rgba(255,255,255,0.1); color: white; }
        .dark-mode .modal-content { background: #151921; color: white; }

        .navbar {
            background: transparent !important;
            backdrop-filter: blur(10px);
        }

        .status-badge {
            padding: 8px 16px;
            border-radius: 100px;
            background: var(--primary-gradient);
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg py-4">
        <div class="container">
            <a class="navbar-brand fw-800 fs-3 text-primary" href="#" style="background: var(--primary-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                PROPTECH
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="status-badge">SISTEMA ACTIVO</span>
                <button onclick="toggleDarkMode()" class="btn btn-dark rounded-pill px-4">🌓</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-5">
        <div class="row g-4">
            <div class="col-lg-3">
                <div class="card p-4 mb-4 text-center">
                    <p class="text-muted small fw-bold mb-1">INMUEBLES EN RED</p>
                    <h2 class="display-5 fw-800 m-0" th:text="${totalInmuebles}">0</h2>
                </div>

                <div class="card p-4 mb-4">
                    <h6 class="fw-bold mb-4">Operaciones Inteligentes</h6>
                    <div class="d-grid gap-3">
                        <button class="btn btn-dynamic text-start" data-bs-toggle="modal" data-bs-target="#modalInmueble">Registrar Propiedad</button>
                        <button class="btn btn-dynamic text-start" data-bs-toggle="modal" data-bs-target="#modalFiltros">Búsqueda Avanzada</button>
                        <button class="btn btn-dynamic text-start" data-bs-toggle="modal" data-bs-target="#modalCliente">Nuevo Cliente</button>
                        <button class="btn btn-dynamic text-start" data-bs-toggle="modal" data-bs-target="#modalPedirReco">Recomendaciones</button>
                        
                        <form th:action="@{/analizar-comportamiento}" method="post">
                            <button type="submit" class="btn btn-dynamic w-100 text-start text-warning">Analizar Riesgos</button>
                        </form>
                        <form th:action="@{/generar-reportes}" method="post">
                            <button type="submit" class="btn btn-dynamic w-100 text-start text-primary">Business Intelligence</button>
                        </form>
                    </div>
                </div>

                <div class="card p-4 border-start border-4 border-primary">
                    <h6 class="fw-bold text-primary mb-3">Historial (Stack)</h6>
                    <div class="bg-white bg-opacity-50 p-3 rounded-4 mb-3 small" th:text="${ultimaAccion}"></div>
                    <form th:action="@{/deshacer-accion}" method="post" th:if="${hayHistorial}">
                        <button type="submit" class="btn btn-outline-primary w-100 rounded-pill btn-sm">DESHACER ÚLTIMA</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-9">
                <div class="card p-2 shadow-lg">
                    <div class="p-4 d-flex justify-content-between align-items-center">
                        <h5 class="fw-800 m-0">Mapa Jerárquico de Precios</h5>
                        <div class="d-flex gap-2">
                            <span class="badge bg-light text-dark border">ABB Structure</span>
                        </div>
                    </div>
                    <div id="myDiagramDiv"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalInmueble" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content shadow-24 border-0 rounded-5">
                <div class="modal-header border-0 p-4">
                    <h5 class="fw-800">Registrar Inmueble</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form th:action="@{/registrar-inmueble}" method="post">
                    <div class="modal-body p-4 pt-0">
                        <div class="row g-3">
                            <div class="col-md-4"><input type="text" name="codigo" class="form-control p-3 rounded-4" placeholder="Código" required></div>
                            <div class="col-md-8"><input type="text" name="direccion" class="form-control p-3 rounded-4" placeholder="Dirección" required></div>
                            <div class="col-md-6"><input type="text" name="ciudad" class="form-control p-3 rounded-4" placeholder="Ciudad" required></div>
                            <div class="col-md-6"><input type="text" name="barrioZona" class="form-control p-3 rounded-4" placeholder="Barrio" required></div>
                            <div class="col-md-4">
                                <select name="finalidad" class="form-select p-3 rounded-4">
                                    <option value="Venta">Venta</option>
                                    <option value="Arriendo">Arriendo</option>
                                </select>
                            </div>
                            <div class="col-md-4"><input type="number" name="precio" class="form-control p-3 rounded-4" placeholder="Precio ($)" required></div>
                            <div class="col-md-4"><input type="number" step="0.1" name="area" class="form-control p-3 rounded-4" placeholder="Área m2" required></div>
                        </div>
                    </div>
                    <div class="modal-footer border-0 p-4 pt-0">
                        <button type="submit" class="btn btn-primary w-100 rounded-pill p-3 fw-bold">GUARDAR ACTIVO</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modalReportes" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content rounded-5 border-0 shadow">
                <div class="modal-header border-0 p-4">
                    <h5 class="fw-800">Panel de Inteligencia</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4 pt-0">
                    <ul class="nav nav-pills mb-4" id="pills-tab">
                        <li class="nav-item w-50"><button class="nav-link active w-100 rounded-pill" data-bs-toggle="pill" data-bs-target="#asesores">Ranking Asesores</button></li>
                        <li class="nav-item w-50"><button class="nav-link w-100 rounded-pill" data-bs-toggle="pill" data-bs-target="#zonas">Flujo por Zonas</button></li>
                    </ul>
                    <div class="tab-content">
                        <div class="tab-pane fade show active" id="asesores">
                            <ul class="list-group list-group-flush">
                                <li th:each="asesor : ${listaRankingAsesores}" class="list-group-item d-flex justify-content-between p-3" th:text="${asesor}"></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        function initTree() {
            const $ = go.GraphObject.make;
            window.myDiagram = $(go.Diagram, "myDiagramDiv", {
                layout: $(go.TreeLayout, { angle: 90, layerSpacing: 40 }),
                "undoManager.isEnabled": true
            });

            myDiagram.nodeTemplate = $(go.Node, "Auto",
                $(go.Shape, "RoundedRectangle", { stroke: null, fill: "white", parameter1: 20, desiredSize: new go.Size(100, 50) },
                    new go.Binding("fill", "", (n) => document.body.classList.contains("dark-mode") ? "#2d3748" : "white")),
                $(go.TextBlock, { font: "600 12px Plus Jakarta Sans" }, new go.Binding("text"))
            );

            myDiagram.linkTemplate = $(go.Link, { routing: go.Link.Orthogonal, corner: 15 },
                $(go.Shape, { strokeWidth: 2, stroke: "#6366f1" }));

            const rawData = JSON.parse([[${treeJsonData}]]);
            myDiagram.model = new go.TreeModel(rawData);
        }
        window.addEventListener('DOMContentLoaded', initTree);

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
            myDiagram.nodes.each(n => n.updateTargetBindings());
        }
    </script>
</body>
</html>
